<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recipe Finder</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      color: #1DB954;
      margin-bottom: 10px;
    }

    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input[type="text"] {
      padding: 10px;
      border: none;
      border-radius: 4px;
      background-color: #1E1E1E;
      color: #FFFFFF;
      outline: none;
      min-width: 200px;
    }

    button {
      background-color: #1DB954;
      color: #FFFFFF;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #1AA34A;
    }

    .tag {
      background-color: #1DB954;
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      margin: 5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .tag span {
      cursor: pointer;
      font-weight: bold;
    }

    #recipes {
      margin-top: 30px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .recipe {
      background-color: #1E1E1E;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    .recipe img {
      width: 100%;
      border-radius: 6px;
    }

    .recipe h3 {
      color: #1DB954;
      font-size: 18px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Recipe Finder</h1>

  <div class="input-container">
    <input type="text" id="ingredientInput" placeholder="Add an ingredient..." />
    <button onclick="addIngredient()">Add</button>
    <button onclick="searchRecipes()">Search Recipes</button>
  </div>

  <div id="ingredientTags"></div>
  <div id="recipes"></div>

  <script>
    let ingredients = [];

    function addIngredient() {
      const input = document.getElementById('ingredientInput');
      const value = input.value.trim();
      if (value && !ingredients.includes(value.toLowerCase())) {
        ingredients.push(value.toLowerCase());
        input.value = '';
        displayTags();
      }
    }

    function removeIngredient(index) {
      ingredients.splice(index, 1);
      displayTags();
    }

    function displayTags() {
      const tagContainer = document.getElementById('ingredientTags');
      tagContainer.innerHTML = '';
      ingredients.forEach((ingredient, index) => {
        const tag = document.createElement('div');
        tag.className = 'tag';
        tag.innerHTML = `${ingredient} <span onclick="removeIngredient(${index})">&times;</span>`;
        tagContainer.appendChild(tag);
      });
    }

    async function searchRecipes() {
      if (ingredients.length === 0) {
        alert("Please add at least one ingredient.");
        return;
      }

      const recipesContainer = document.getElementById('recipes');
      recipesContainer.innerHTML = 'Loading recipes...';

      try {
        const response = await fetch(`https://api.spoonacular.com/recipes/findByIngredients?ingredients=${ingredients.join(',')}&number=10&apiKey=7eb94ef455104478b6fab75575e58bde`);
        const data = await response.json();

        if (!data.length) {
          recipesContainer.innerHTML = '<p>No recipes found. Try different ingredients.</p>';
          return;
        }

        recipesContainer.innerHTML = '';
        data.forEach(recipe => {
          const recipeCard = document.createElement('div');
          recipeCard.className = 'recipe';
          recipeCard.innerHTML = `
            <img src="${recipe.image}" alt="${recipe.title}" />
            <h3>${recipe.title}</h3>
          `;
          recipesContainer.appendChild(recipeCard);
        });
      } catch (error) {
        console.error(error);
        recipesContainer.innerHTML = '<p>Failed to fetch recipes. Check your API key or internet connection.</p>';
      }
    }
  </script>
</body>
</html>
